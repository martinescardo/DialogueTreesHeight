# Typechecks the development, renders it to html with agda-html.py,
# compiles the paper, and publishes both on GitHub Pages.
#
# Pinned: TypeTopology at the commit the development was checked
# against, and the Agda image TypeTopology's own workflow uses
# (ghcr.io/ayberkt/docker-agda-minimal, Agda 2.9.0-rc1), by digest.
# The script agda-html.py and the stylesheet are TypeTopology's own
# copies in admin-utilities and assets, taken from a later commit,
# pinned separately.

on:
  push:
    branches:
    - master
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TYPETOPOLOGY_COMMIT: ee4e4c86da34ac609389285baa01e2eab6062b37
  HTML_SCRIPT_COMMIT: 43157f4b32b1fc272739596f2116878fbfca6760

jobs:
  html:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ayberkt/docker-agda-minimal@sha256:afeaf23ddce06c94132d4ceea5b169298b1d878ed4c6d52d400d58dcea1e3065
    steps:
    - name: Clone this repository
      uses: actions/checkout@v4

    - name: Clone TypeTopology at the pinned commit
      uses: actions/checkout@v4
      with:
        repository: martinescardo/TypeTopology
        ref: ${{ env.TYPETOPOLOGY_COMMIT }}
        path: TypeTopology

    - name: Clone the html script and stylesheet at their pinned commit
      uses: actions/checkout@v4
      with:
        repository: martinescardo/TypeTopology
        ref: ${{ env.HTML_SCRIPT_COMMIT }}
        path: TypeTopologyTools
        sparse-checkout: |
          admin-utilities/agda-html.py
          assets/Agda.css
        sparse-checkout-cone-mode: false

    - name: Restore the TypeTopology interface files
      uses: actions/cache@v4
      with:
        path: TypeTopology/_build
        key: typetopology-agdai-${{ env.TYPETOPOLOGY_COMMIT }}

    - name: Register TypeTopology with Agda
      run: |
        mkdir -p "$RUNNER_TEMP/agda"
        echo "$GITHUB_WORKSPACE/TypeTopology/typetopology.agda-lib" > "$RUNNER_TEMP/agda/libraries"
        echo "AGDA_DIR=$RUNNER_TEMP/agda" >> "$GITHUB_ENV"

    - name: Typecheck
      run: |
        agda --version
        cd source
        agda --safe DialogueTreesHeight/index.lagda +RTS -A64M -RTS

    - name: Render and check the html
      run: |
        python3 TypeTopologyTools/admin-utilities/agda-html.py \
          --typetopology . \
          --entry DialogueTreesHeight/index.lagda \
          --css TypeTopologyTools/assets/Agda.css \
          --out html
        python3 TypeTopologyTools/admin-utilities/agda-html.py \
          --typetopology . \
          --entry DialogueTreesHeight/index.lagda \
          --html html --out html --check
        printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=DialogueTreesHeight.index.html"><a href="DialogueTreesHeight.index.html">DialogueTreesHeight.index</a>\n' > html/index.html

    - uses: actions/upload-artifact@v4
      with:
        name: html
        path: html

  pdf:
    runs-on: ubuntu-latest
    steps:
    - name: Clone this repository
      uses: actions/checkout@v4

    - name: Compile the paper
      uses: xu-cheng/latex-action@v3
      with:
        root_file: dialogue-tree-height.tex
        working_directory: latex

    - uses: actions/upload-artifact@v4
      with:
        name: pdf
        path: latex/dialogue-tree-height.pdf

  deploy:
    needs: [html, pdf]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: html
        path: site
    - uses: actions/download-artifact@v4
      with:
        name: pdf
        path: site
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
